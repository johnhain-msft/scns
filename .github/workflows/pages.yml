# Publishes the SCNS slide deck to GitHub Pages.
#
# The deck is a single self-contained HTML file at `docs/slides/index.html` —
# no build step, no dependencies — so this workflow only uploads that directory
# and deploys it. It is NOT part of the blocking CI gate (`ci.yml`): a Pages
# outage should never hold up a merge.
#
# The shared workflow contract in `test/unit/ci/ci-workflow.test.ts` applies to
# this file too: every job carries an explicit `timeout-minutes` and every
# action is pinned to a major version tag.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/slides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slides
      - id: deployment
        uses: actions/deploy-pages@v4
